<style>
:root{
  --blue:#73BEFF; --b50:#E3F2FD; --chip:#E3F2FD; --chipT:#1976D2; --mblue:#2196F3;
  --g50:#FAFAFA; --g100:#F5F5F5; --g200:#EEEEEE; --g300:#E0E0E0; --g400:#BDBDBD; --g500:#9E9E9E; --g600:#757575; --g700:#616161; --g800:#424242;
  --red:#F44336; --red6:#E53935; --b87:rgba(0,0,0,.87); --b54:rgba(0,0,0,.54);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#fff}
body{font-family:var(--font)}
#app{position:absolute;left:0;top:0;width:390px;height:844px;overflow:hidden;transform-origin:0 0;background:#fff;
  font-family:var(--font);font-size:14px;font-weight:500;color:#000;line-height:1.43;word-break:keep-all;overflow-wrap:anywhere;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:#000;border:0;outline:0;background:transparent;user-select:text;-webkit-user-select:text}
textarea{resize:none}
img{display:block;-webkit-user-drag:none}
[data-act]{cursor:pointer}
.w7{font-weight:700}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.sp{flex:1 1 auto;min-width:0}
.pre{white-space:pre-line}
.nos{scrollbar-width:none}.nos::-webkit-scrollbar{display:none}

/* stage / tabs / screens */
#stage{position:absolute;left:0;top:0;width:390px;height:754px;overflow:hidden}
.tab{position:absolute;inset:0;display:none}
.tab.on{display:block}
.screen{position:absolute;inset:0;overflow:hidden;background:#fff}
.appbar{position:absolute;left:0;top:0;right:0;height:103px;padding-top:47px;z-index:3}
.tb{position:relative;height:56px}
.lead{position:absolute;left:4px;top:4px}
.acts{position:absolute;right:0;top:4px;display:flex}
.ttl{position:absolute;left:72px;right:72px;top:0;height:56px;display:flex;align-items:center;justify-content:center}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%}
.ib:active{background:rgba(0,0,0,.06)}
.scroll{position:absolute;left:0;right:0;top:103px;bottom:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:16px;background:#fff;display:grid;place-items:center;z-index:4;
  box-shadow:0 3px 6px rgba(0,0,0,.14),0 6px 16px rgba(0,0,0,.10)}
.fab svg{transition:transform .25s}
.fab.open svg{transform:rotate(45deg)}

/* status bar & nav */
#status{position:absolute;left:0;top:0;width:390px;height:47px;z-index:60;pointer-events:none;color:#000}
#status .t{position:absolute;left:0;width:108px;top:14px;text-align:center;font:600 17px/20px -apple-system,"SF Pro Text",var(--font);letter-spacing:-.3px}
#status .ic{position:absolute;right:26px;top:18px;display:flex;gap:6px;align-items:center}
#nav{position:absolute;left:0;bottom:0;width:390px;height:90px;background:#fff;z-index:20;box-shadow:0 -1px 4px rgba(0,0,0,.05)}
#nav .it{position:absolute;top:0;width:130px;height:56px;display:grid;place-items:center}
#nav .hi{position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:3px;background:#000}

/* overlays */
#sov{position:absolute;left:0;top:0;width:390px;height:754px;z-index:30;pointer-events:none}
#rov{position:absolute;inset:0;z-index:50;pointer-events:none}
.barrier{position:absolute;inset:0;background:rgba(0,0,0,.54);pointer-events:auto}
.dlg{position:absolute;left:40px;right:40px;top:50%;transform:translateY(-50%);background:#fff;border-radius:20px;padding:20px;pointer-events:auto;max-height:780px;
  box-shadow:0 6px 20px rgba(0,0,0,.18)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;pointer-events:auto;max-height:640px;overflow-y:auto;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.handle{width:40px;height:4px;border-radius:2px;background:var(--g300);margin:12px auto 20px}
.drawer{position:absolute;right:0;top:0;bottom:0;width:331.5px;background:#fff;pointer-events:auto;display:flex;flex-direction:column}
#snack{position:absolute;left:16px;right:16px;bottom:106px;z-index:40;pointer-events:none}
.snk{border-radius:12px;padding:14px 16px;color:#fff;font-size:16px;font-weight:500;box-shadow:0 3px 8px rgba(0,0,0,.2);line-height:1.35}
#fx{position:absolute;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.tapfx{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(25,25,25,.34);border:2.5px solid rgba(255,255,255,.85);
  box-shadow:0 0 0 1px rgba(0,0,0,.08);animation:tap .6s ease-out forwards}
@keyframes tap{0%{transform:scale(.35);opacity:0}25%{opacity:1}100%{transform:scale(1.25);opacity:0}}

/* shared components */
.chip{display:inline-block;padding:4px 8px;border-radius:10px;background:var(--chip);color:var(--chipT);font-size:12px;font-weight:500}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 8px rgba(158,158,158,.08)}
.av{position:absolute;top:0;border-radius:50%;overflow:hidden}
.av.e{background:var(--g100);border:.5px solid var(--g200);display:grid;place-items:center}
.av img{width:100%;height:100%;object-fit:cover}
.pill{display:inline-flex;align-items:center;flex:0 0 auto;margin-right:8px;padding:6px 12px;border-radius:25px;border:1px solid var(--g300);background:#fff;font-size:14px;font-weight:500;white-space:nowrap}
.pill.on{background:#000;border-color:#000;color:#fff}
.udj{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 4px 1px rgba(158,158,158,.1)}
.grey6{color:var(--g600)}
.inp{border:1px solid var(--g300);border-radius:8px;padding:16px 12px;font-size:16px;line-height:1.5;width:100%;display:block;background:#fff}
.inp:focus{border-color:var(--blue)}
.inp::placeholder,textarea::placeholder,input::placeholder{color:var(--g400)}
.btn{display:block;width:100%;background:var(--blue);color:#fff;border-radius:12px;padding:16px 0;font-size:16px;font-weight:500;text-align:center}
.tbtn{display:block;width:100%;padding:16px 0;text-align:center;font-size:16px;font-weight:700;color:var(--blue);border-radius:20px}
.tbtn:disabled{color:var(--g400);cursor:default}
.divider{height:16px;display:flex;align-items:center}.divider:after{content:"";display:block;height:1px;width:100%;background:var(--dv,#CAC4D0)}
.lbl{font-size:12px;color:var(--g600);font-weight:500}
.tag{display:inline-block;padding:8px 16px;border-radius:20px;background:var(--g100);border:1px solid var(--g100);color:var(--b87);font-size:14px;font-weight:500}
.tag.on{background:#000;border-color:#000;color:#fff;font-weight:700}
.opt{display:inline-block;padding:8px 16px;border-radius:20px;background:#fff;border:1px solid var(--g300);font-size:14px;font-weight:500}
.opt.on{background:rgba(115,190,255,.2);border:2px solid var(--blue);color:var(--blue);padding:7px 15px;font-weight:700}
.ttlbtn{padding:8px 16px;font-size:16px;font-weight:700}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #E0E0E0;border-top-color:#9E9E9E;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tapr{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){ .tapfx{animation:tapr .6s linear forwards} .fab svg{transition:none} }
</style>
</head>

/* Flutter LinearGradient 은 비-premultiplied 보간이라 rgba(115,190,255,.01)→grey100 사이가 푸르게 보인다. 같은 결과를 CSS 다중 stop으로 재현 */
function flutterGrad(bg, c0, a0, c1, a1, n = 14){
  const st = [];
  for (let i = 0; i <= n; i++){
    const t = i / n, a = a0 + (a1 - a0) * t;
    const ch = k => Math.round(bg[k] * (1 - a) + (c0[k] + (c1[k] - c0[k]) * t) * a);
    st.push(`rgb(${ch(0)},${ch(1)},${ch(2)}) ${(t * 100).toFixed(1)}%`);
  }
  return `linear-gradient(180deg,${st.join(',')})`;
}

function avatars(cur, max, r = 20, sp = 22){
  let disp, fill;
  if (max <= 4){ disp = max; fill = cur; } else { disp = 4; fill = cur >= 3 ? 3 : cur; }
  let h = `<div style="position:relative;flex:0 0 auto;width:${disp * sp + r}px;height:${r * 2}px">`;
  for (let i = 0; i < disp; i++){
    const empty = i < disp - fill;
    h += empty
      ? `<div class="av e" style="right:${i * sp}px;width:${r * 2}px;height:${r * 2}px">${ic('add', r * .8, '#BDBDBD')}</div>`
      : `<div class="av" style="right:${i * sp}px;width:${r * 2}px;height:${r * 2}px"><img src="${A}profile.webp" alt=""></div>`;
  }
  return h + '</div>';
}

/* ---------- 학사 일정 ---------- */
const EVENTS = [
  {d:7, t:'제2학기 수강신청'}, {d:11, t:'여름 계절학기 종강'}, {d:11, t:'2025 하계 학위수여식'},
  {d:15, t:'광복절'}, {d:22, t:'제1학기 성적 정정 마감'}, {d:26, t:'제2학기 등록 기간'}
];
SC.calendar = { bg: () => '#fff', render(p){
  const first = new Date(2025, 7, 1).getDay(), days = 31;
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div></div>';
  for (let d = 1; d <= days; d++){
    const w = (first + d - 1) % 7, we = w === 0 || w === 6;
    const ev = EVENTS.filter(e => e.d === d), sel = p.sel === d, today = d === TODAY.d;
    cells += `<div data-act="calDay" data-arg="${d}" style="min-width:0;height:76px;padding:${sel || today ? 4 : 8}px 0 0;${sel || today ? `margin:4px 2px 0;border-radius:8px;background:${sel ? 'rgba(115,190,255,.25)' : 'rgba(158,158,158,.2)'}` : ''}">
      <div style="text-align:center;font-size:14px;color:${we ? '#9E9E9E' : '#000'}">${d}</div>
      ${ev.slice(0, 2).map(e => `<div class="ell" style="margin:2px 1px 0;padding:1px 3px;border-radius:3px;background:#E6D7F7;font-size:10px;text-align:center">${e.t}</div>`).join('')}
    </div>`;
  }
  const evs = p.sel ? EVENTS.filter(e => e.d === p.sel) : EVENTS;
  return `${appbar('#fff', T20('학사 일정'), {arrow: true})}
  <div class="scroll" style="bottom:210px">
    <div style="padding:8px 16px"><div class="w7" style="font-size:28px">8월</div></div>
    <div style="padding:0 4px">
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:14px;padding:6px 0">${DOW.map((d, i) => `<div style="color:${i === 0 || i === 6 ? '#9E9E9E' : '#000'}">${d}</div>`).join('')}</div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr))">${cells}</div>
    </div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:214px;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.12);display:flex;flex-direction:column">
    <div style="width:40px;height:4px;border-radius:2px;background:#E0E0E0;margin:8px auto 0"></div>
    <div class="w7" style="font-size:18px;padding:14px 16px 12px">${p.sel ? `8월 ${p.sel}일` : '8월 이벤트'}</div>
    <div style="height:1px;background:#EEEEEE"></div>
    <div class="nos" style="flex:1;overflow-y:auto;padding:12px 16px">
      ${evs.length ? evs.map(e => `<div class="row" style="margin-bottom:8px;padding:12px;border-radius:8px;border:1px solid #B39DDB">
        <div style="width:12px;height:12px;border-radius:50%;background:#B39DDB"></div><span style="width:12px"></span>
        <span class="sp" style="font-size:14px;color:var(--b87)">${e.t}</span><span style="padding:4px 8px;border-radius:8px;background:#9575CD;color:#fff;font-size:10px">8월 ${e.d}일</span></div>`).join('')
        : '<div style="text-align:center;color:#9E9E9E;font-size:16px;padding:24px 0">이벤트가 없습니다</div>'}
    </div>
  </div>`;
}};

  board:'board', boardDetail:'board', boardMine:'board', chat:'chat', room:'chat', signal:'signal', lab:'lab', labList:'lab', calendar:'calendar', support:'support', profile:'profile'};

/* =========================================================
   4. 내비게이션 (탭별 스택 = Flutter 중첩 Navigator)
   ========================================================= */
const tabs = [[], [], []];
let cur = 0;
const ROOTS = ['home', 'signal', 'chat'];
const EASE = 'cubic-bezier(.2,.8,.2,1)';
function mk(id, p){
  const el = document.createElement('section'); el.className = 'screen'; el.dataset.id = id;
  const e = {id, p: p || {}, el};
  if (SC[id].init) SC[id].init(e.p);
  return e;
}
function render(e){
  const keep = $$('.scroll', e.el).map(x => x.scrollTop);
  const def = SC[e.id];
  e.el.style.background = def.bg ? def.bg(e.p) : '#fff';
  e.el.innerHTML = def.render(e.p, e);
  $$('.scroll', e.el).forEach((x, i) => { if (keep[i]) x.scrollTop = keep[i]; });
  if (def.after) def.after(e.p, e);
}
const top = (t = cur) => tabs[t][tabs[t].length - 1];
function refresh(){ const e = top(); if (e) render(e); }
function anim(el, from, to, dur = 250){
  if (!ANIM) return Promise.resolve();
  return el.animate([{transform: from}, {transform: to}], {duration: dur, easing: EASE}).finished.catch(() => {});
}
function push(id, p, opt = {}){
  const prev = top(), e = mk(id, p);
  tabs[cur].push(e); render(e);
  $('#tab' + cur).appendChild(e.el);
  closeFabMenus();
  if (prev && !opt.instant && ANIM){
    e.el.style.boxShadow = '-6px 0 18px rgba(0,0,0,.08)';
    anim(prev.el, 'translateX(0)', 'translateX(-30%)');
    anim(e.el, 'translateX(100%)', 'translateX(0)').then(() => { e.el.style.boxShadow = ''; if (top() === e) prev.el.style.display = 'none'; });
  } else if (prev) prev.el.style.display = 'none';
  notify();
  return e;
}
function pop(opt = {}){
  const s = tabs[cur]; if (s.length < 2) return;
  const e = s.pop(), prev = top();
  prev.el.style.display = ''; render(prev);
  closeFabMenus(); closeLayer('sov');
  if (!opt.instant && ANIM){
    anim(prev.el, 'translateX(-30%)', 'translateX(0)');
    anim(e.el, 'translateX(0)', 'translateX(100%)').then(() => e.el.remove());
  } else e.el.remove();
  notify();
}
function showTab(i){
  cur = i;
  [0, 1, 2].forEach(k => $('#tab' + k).classList.toggle('on', k === i));
  drawNav();
}
function switchTab(i){
  closeLayer('sov'); closeFabMenus();
  if (i === cur){ // 같은 탭 다시 누르면 루트까지 pop
    while (tabs[cur].length > 1) tabs[cur].pop().el.remove();
    const r = top(); r.el.style.display = ''; render(r);
  } else { showTab(i); const t = top(); t.el.style.display = ''; render(t); }
  drawNav(); notify();
}
function resetStacks(){
  closeLayer('sov'); closeLayer('rov'); $('#snack').innerHTML = '';
  [0, 1, 2].forEach(k => { tabs[k].forEach(e => e.el.remove()); tabs[k] = []; });
  [0, 1, 2].forEach(k => { const e = mk(ROOTS[k]); tabs[k].push(e); render(e); $('#tab' + k).appendChild(e.el); });
  showTab(0);
}
function drawNav(){
  const items = [['home', '홈'], ['fav', '유니시그널'], ['chat', '채팅']];
  $('#nav').innerHTML = items.map(([n, l], i) => `<button class="it" style="left:${i * 130}px" data-act="tab" data-arg="${i}" aria-label="${l}">
     ${sy(cur === i ? n + '_f' : n, 24, cur === i ? '#000' : 'rgba(0,0,0,.54)')}</button>`).join('') + '<div class="hi"></div>';
}
let lastSent = '';
function notify(){
  const e = top(); if (!e) return;
  const id = MAIN_ID[e.id] || e.id;
  document.body.style.background = SC[e.id].bg ? SC[e.id].bg(e.p) : '#fff';
  const key = id + '|' + e.id;
  if (key === lastSent) return; lastSent = key;

    lab: [0, ['lab']], calendar: [0, ['calendar']], support: [0, ['support']], profile: [0, ['profile']],

    signal: [1, []], chat: [2, []], chatroom: [2, S.chats.length ? [['room', {id: (S.chats.find(c => c.id === 'k3') || S.chats[0]).id}]] : []]
  }[id] || [0, []];
  showTab(path[0]);

/* =========================================================
   5. 오버레이: 다이얼로그 / 시트 / 드로어 / 스낵바

function layer(where, html, kind, onClose){
  const host = $('#' + where);
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;inset:0;pointer-events:auto';
  wrap.innerHTML = `<div class="barrier" data-act="closeLayer" data-arg="${where}"></div>${html}`;
  wrap._onClose = onClose;
  host.appendChild(wrap);
  const box = wrap.lastElementChild;
  if (ANIM){
    wrap.firstElementChild.animate([{opacity: 0}, {opacity: 1}], {duration: 180});
    if (kind === 'dialog') box.animate([{opacity: 0, transform: 'translateY(-50%) scale(.92)'}, {opacity: 1, transform: 'translateY(-50%) scale(1)'}], {duration: 180, easing: EASE});
    if (kind === 'sheet') box.animate([{transform: 'translateY(100%)'}, {transform: 'translateY(0)'}], {duration: 250, easing: EASE});
    if (kind === 'drawer') box.animate([{transform: 'translateX(100%)'}, {transform: 'translateX(0)'}], {duration: 250, easing: EASE});
  }
  return box;
}
function closeLayer(where){
  const host = $('#' + where); if (!host) return;
  Array.from(host.children).forEach(w => { if (w._onClose) w._onClose(); w.remove(); });
}
const dialog = html => layer('rov', `<div class="dlg" role="dialog">${html}</div>`, 'dialog');
const sheet = (html, onClose) => layer('sov', `<div class="sheet" role="dialog">${html}</div>`, 'sheet', onClose);
let snackT = 0;
function snack(msg, err){
  const fab = top() && SC[top().id].fab;
  const box = $('#snack'); box.style.bottom = (90 + 16 + (fab ? 72 : 0)) + 'px';
  box.innerHTML = `<div class="snk" style="background:${err ? '#E53935' : '#73BEFF'}">${esc(msg)}</div>`;
  if (ANIM) box.firstChild.animate([{opacity: 0, transform: 'translateY(8px)'}, {opacity: 1, transform: 'none'}], {duration: 200});
  clearTimeout(snackT); snackT = setTimeout(() => { box.innerHTML = ''; }, STATIC ? 60000 : 2000);
}
function closeFabMenus(){
  $$('[data-fabmenu]').forEach(x => x.remove());
  tabs.forEach(s => s.forEach(e => { if (e.p.fabOpen){ e.p.fabOpen = false; const f = $('.fab', e.el); if (f) f.classList.remove('open'); } }));
}
function fabMenu(opts){
  const e = top(); e.p.fabOpen = true; $('.fab', e.el).classList.add('open');

  e.el.appendChild(m);

}

    if (!f.content.trim()) return snack('내용을 입력해주세요!', true);
    if (!f.max) return snack('총 인원을 입력해주세요!', true);
    if (!(max >= 2 && max <= 100)) return snack('총 인원 수는 2~100명입니다.', true);
    const post = {id: 'n' + Date.now(), ut: p.ut, sub: f.sub || '기타', title: f.title.trim(), content: f.content.trim(), cur: 1, max, ago: '방금 전', views: 0, author: ME, joined: true};
    S.connect.unshift(post); S.mine.unshift({kind: 'connect', badge: '커넥트', color: '#2196F3', text: post.title});
    pop(); const e = top(); if (e.id === 'connect'){ e.p.ut = p.ut; e.p.idx = 0; e.p.child = null; render(e); }
    snack('모임이 성공적으로 개설되었습니다!');
  },
  /* 카풀 글쓰기 */
  cwSet: a => { const i = a.indexOf(':'), k = a.slice(0, i), v = a.slice(i + 1); const f = top().p.f; f[k] = (k === 'd' || k === 'max') ? +v : v; refresh(); },
  cwSubmit: () => {
    const f = top().p.f;
    if (!f.from) return snack('출발지를 입력해주세요!', true);
    if (!f.to) return snack('도착지를 입력해주세요!', true);
    if (!f.d) return snack('출발 날짜를 선택해주세요!', true);
    if (!f.time) return snack('출발 시간을 입력해주세요!', true);
    const post = {id: 'n' + Date.now(), m: 8, d: f.d, time: f.time, from: f.from, to: f.to, cur: 1, max: f.max, title: f.title.trim() || `${f.from} → ${f.to}`, author: ME, joined: true};
    S.carpool.unshift(post); S.mine.unshift({kind: 'carpool', badge: '카풀', color: '#4CAF50', text: post.title});
    pop(); const e = top(); if (e.id === 'carpool'){ e.p.date = null; e.p.q = ''; render(e); const s = $('.scroll', e.el); if (s) s.scrollTop = 0; }
    snack('카풀이 성공적으로 개설되었습니다!');
  },
  /* 중고 거래 */
  mkCat: a => { const p = top().p; p.cat = a; refresh(); },
  mkSearch: () => { const p = top().p; p.searching = true; refresh(); const i = $('input', top().el); i && i.focus(); },
  mkSearchClose: () => { const p = top().p; p.searching = false; p.q = ''; refresh(); },
  mkDetail: a => push('marketDetail', {id: a}),
  mkChat: a => {
    const [k, x] = findMarket(a); if (!x) return;
    joinRoom(k, x.title, x.id, null);
  },
  mkFab: () => {
    if (top().p.fabOpen) return closeFabMenus();
    fabMenu([['bagf', '#2196F3', ' 상품  ', 'mkWrite', 'item'], ['school', '#4CAF50', ' 과외  ', 'mkWrite', 'tutor'], ['homef', '#FF9800', '자취방', 'mkWrite', 'room']]);
  },
  mkWrite: a => { closeFabMenus(); push('marketWrite', {k: a}); },
  mwSubmit: () => {
    const p = top().p, f = p.f, k = p.k, t = (f.title || '').trim();
    const need = {item: [['title','제목을 입력해주세요!'],['price','가격을 입력해주세요!'],['loc','거래 장소를 입력해주세요'],['desc','상품 설명을 입력해주세요!']],
      tutor: [['title','제목을 입력해주세요'],['subject','과목을 입력해주세요'],['pay','시급을 입력해주세요'],['days','주당 수업 일수를 입력해주세요'],['hours','시간 또는 분을 입력해주세요'],['loc','장소를 입력해주세요'],['desc','상세 설명을 입력해주세요']],
      room: [['title','제목을 입력해주세요!'],['dep','보증금을 입력해주세요!'],['rent','월세를 입력해주세요!'],['loc','장소를 입력해주세요!'],['desc','자취방 설명을 입력해주세요!']]}[k];
    for (const [key, msg] of need) if (!String(f[key] || '').trim()) return snack(msg, true);
    const id = 'n' + Date.now();
    const post = k === 'item' ? {id, title: t, loc: f.loc, price: +f.price || 0, ago: '방금 전', th: 'box', desc: f.desc}
      : k === 'tutor' ? {id, title: t, subject: f.subject, pay: +f.pay || 0, days: +f.days || 1, hours: f.hours + '시간', loc: f.loc, ago: '방금 전', desc: f.desc}
      : {id, title: t, loc: f.loc, dep: +f.dep || 0, rent: +f.rent || 0, ago: '방금 전', th: 'room', desc: f.desc};
    S.market[k].unshift(post); S.mine.unshift({kind: 'market', badge: '중고', color: '#FF9800', text: t});
    pop(); const e = top(); if (e.id === 'market'){ e.p.cat = k; render(e); }
    snack(MKW[k].ok);
  },
  /* 대나무숲 */
  bdRequest: () => {
    const p = top().p, t = (p.draft || '').trim(); if (!t) return;
    S.mine.unshift({kind: 'board', badge: '잔디', color: '#4CAF50', text: t});
    p.draft = ''; refresh();
    snack('요청이 전송되었습니다! 관리자 승인 후 게시됩니다.');
  },
  boardDetail: a => { const b = S.board.find(x => x.id === a); if (b) b.views++; push('boardDetail', {id: a}); },
  bdLike: () => { const b = S.board.find(x => x.id === top().p.id); b.liked = !b.liked; b.likes += b.liked ? 1 : -1; refresh(); },
  bdCLike: a => { const b = S.board.find(x => x.id === top().p.id), c = b.comments[+a]; c.liked = !c.liked; c.likes += c.liked ? 1 : -1; refresh(); },
  bdComment: () => {
    const e = top(), inp = $('input[data-in="bdcomment"]', e.el), t = (inp && inp.value || '').trim(); if (!t) return;
    S.board.find(x => x.id === e.p.id).comments.push({name: ME, ago: '방금 전', text: t, likes: 0, liked: false});
    refresh(); const s = $('.scroll', e.el); if (s) s.scrollTop = s.scrollHeight;
  },
  /* 학사 일정 / 문의 */
  calDay: a => { const p = top().p; p.sel = p.sel === +a ? null : +a; refresh(); },
  spSubmit: () => {
    const p = top().p;
    if (!(p.t || '').trim() || !(p.c || '').trim()) return snack('제목과 내용을 입력해주세요!', true);
    S.support.unshift({title: p.t.trim(), content: p.c.trim(), date: '2025.08.14', done: false});
    p.t = ''; p.c = ''; refresh();
    snack('문의가 성공적으로 등록되었습니다! 빠른 시일 내에 답변드리겠습니다.');
  },
  /* 채팅 */
  chatTab: a => { top().p.idx = +a; refresh(); },
  chatRefresh: () => {
    const e = top(); if (STATIC) return refresh();
    e.p.loading = true; render(e);
    setTimeout(() => { e.p.loading = false; if (top() === e) render(e); }, 500);
  },
  openRoom: a => { const c = S.chats.find(x => x.id === a); if (c) c.unread = 0; push('room', {id: a}); },
  send: () => {
    const e = top(), inp = $('input[data-in="msg"]', e.el), t = (inp && inp.value || '').trim(); if (!t) return;
    const c = S.chats.find(x => x.id === e.p.id);
    c.msgs.push(['me', t, '오전 09:41', String(c.n - 1)]); c.ago = '방금 전';
    S.chats.splice(S.chats.indexOf(c), 1); S.chats.unshift(c);
    render(e); const i2 = $('input[data-in="msg"]', e.el); if (i2 && !AUTO.on) i2.focus();
  },
  roomDrawer: () => {
    const c = S.chats.find(x => x.id === top().p.id); if (!c) return;
    const others = [...new Set(c.msgs.map(m => m[0]).filter(n => n !== 'me'))];
    const people = [ME, ...others]; while (people.length < c.n) people.push('참여자' + people.length);
    layer('sov', `<div class="drawer" role="dialog" aria-label="채팅방 정보">
      <div style="height:47px"></div>
      <div class="col" style="align-items:center;padding:24px 16px 16px">${circ(80)}<div style="height:12px"></div><div class="w7" style="font-size:18px">${ME}</div></div>
      <div style="height:1px;background:#EEEEEE"></div>
      <div style="padding:16px" class="sp nos"><div class="w7" style="font-size:16px">참여자 ${c.n}</div><div style="height:8px"></div>
        ${people.slice(0, c.n).map((n, i) => `<div class="row" style="padding:8px 0">${circ(40)}<span style="width:12px"></span>
          ${i === 0 ? '<span style="width:16px;height:16px;border-radius:50%;background:#87CEEB;color:#fff;font-size:12px;display:grid;place-items:center">나</span><span style="width:4px"></span>' : ''}
          <span style="font-size:16px">${esc(n)}</span></div>`).join('')}</div>
      <div style="height:1px;background:#EEEEEE"></div>
      <div class="row" data-act="leaveRoom" style="padding:16px 16px 20px">${ic('exit', 24, '#9E9E9E')}<span style="width:8px"></span><span style="font-size:16px;color:#757575">나가기</span></div>
    </div>`, 'drawer');
  },
  leaveRoom: () => {
    dialog(`<div class="w7" style="font-size:22px;font-weight:500">채팅방 나가기</div><div style="height:16px"></div>
      <div style="font-size:14px;color:#49454F">정말로 이 채팅방을 나가시겠습니까?</div><div style="height:24px"></div>
      <div class="row" style="justify-content:flex-end;gap:8px"><button data-act="closeLayer" data-arg="rov" style="padding:10px 12px;font-size:14px">취소</button>
      <button data-act="leaveOk" style="padding:10px 12px;font-size:14px;color:#F44336">나가기</button></div>`);
  },
  leaveOk: () => {
    const id = top().p.id; S.chats = S.chats.filter(c => c.id !== id);
    closeLayer('rov'); closeLayer('sov'); pop(); snack('채팅방에서 나갔습니다');
  }
};
/* 입력 이벤트 (재렌더 없이 상태만 갱신) */
const INP = {
  carq: (v, e) => { e.p.q = v.trim(); render(e); const ni = $('input[data-in="carq"]', e.el); if (ni){ ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length); } },
  mkq: (v, e) => { e.p.q = v.trim(); render(e); const ni = $('input[data-in="mkq"]', e.el); if (ni){ ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length); } },
  bddraft: (v, e) => { e.p.draft = v; const b = $('#bdReq', e.el); if (b) b.style.color = v.trim() ? '#73BEFF' : '#9E9E9E'; },
  spt: (v, e) => { e.p.t = v; spColor(e); },
  spc: (v, e) => { e.p.c = v; spColor(e); },
  msg: () => {}, bdcomment: () => {}
};
function spColor(e){ const b = $('#spBtn', e.el); if (b) b.style.color = (e.p.t || '').trim() && (e.p.c || '').trim() ? '#73BEFF' : '#9E9E9E'; }

app.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t || !app.contains(t) || t.disabled) return;
  const f = ACT[t.dataset.act];
  if (f){ ev.preventDefault(); f(t.dataset.arg, t, ev); }
});
app.addEventListener('input', ev => {
  const k = ev.target.dataset && ev.target.dataset.in; if (!k) return;
  const e = top();
  if (k.startsWith('f.')){ e.p.f[k.slice(2)] = ev.target.value; return; }
  if (INP[k]) INP[k](ev.target.value, e);
});
app.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || ev.isComposing) return;
  const a = ev.target.dataset && ev.target.dataset.enter;
  if (a && ACT[a]){ ev.preventDefault(); ACT[a](); }
});

/* =========================================================
   7. 자동 투어 (?autoplay=1)
   ========================================================= */
const AUTO = {on: false, tok: 0};
const STOP = {};
const wait = (ms, tok) => new Promise((res, rej) => setTimeout(() => (tok === AUTO.tok && AUTO.on ? res() : rej(STOP)), ms));
function findT(sel){
  const scopes = [$('#rov'), $('#sov'), top() && top().el, $('#nav')];
  for (const s of scopes){ if (!s) continue; const el = $(sel, s); if (el) return el; }
  return null;
}
function ripple(el){
  const r = el.getBoundingClientRect(), a = app.getBoundingClientRect(), k = a.width / 390;
  const x = (r.left + r.width / 2 - a.left) / k, y = (r.top + r.height / 2 - a.top) / k;
  const d = document.createElement('div'); d.className = 'tapfx'; d.style.left = x + 'px'; d.style.top = y + 'px';
  $('#fx').appendChild(d); setTimeout(() => d.remove(), 700);
}
async function tap(sel, tok, after = 600){
  const el = findT(sel); if (!el) throw new Error('tour target missing: ' + sel);
  const sc = el.closest('.scroll');
  if (sc){ const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect(); if (r.top < s.top || r.bottom > s.bottom) { sc.scrollTo({top: sc.scrollTop + (r.top - s.top) - 80, behavior: ANIM ? 'smooth' : 'auto'}); await wait(450, tok); } }
  ripple(el); await wait(220, tok);
  el.click(); await wait(after, tok);
}
async function type(sel, text, tok){
  const el = findT(sel); if (!el) return;
  ripple(el); await wait(250, tok);
  for (let i = 1; i <= text.length; i++){ el.value = text.slice(0, i); el.dispatchEvent(new Event('input', {bubbles: true})); await wait(45, tok); }
}
async function scrollBy(px, tok, ms = 900){ const s = $('.scroll', top().el); if (!s) return; s.scrollTo({top: s.scrollTop + px, behavior: ANIM ? 'smooth' : 'auto'}); await wait(ms, tok); }
async function tour(tok){
  for (;;){
    const t0 = performance.now();
    S = clone(INITIAL); resetStacks(); lastSent = ''; notify();
    await wait(1300, tok);
    await scrollBy(330, tok, 900); await scrollBy(-330, tok, 550);
    await tap('[data-act="push"][data-arg="carpool"]', tok, 1000);          // 홈 → 택시 카풀
    await tap('[data-act="carDate"][data-arg="15"]', tok, 800);             // 날짜 선택
    await tap('[data-act="carDetail"]', tok, 1200);                          // 글 열기
    await tap('[data-act="carJoin"]', tok, 900);                            // 참여 신청 → 채팅방
    await type('input[data-in="msg"]', '안녕하세요! 저도 울산역 가요 🙌', tok);
    await tap('[data-act="send"]', tok, 1200);                               // 말풍선 추가
    await tap('#nav [data-arg="0"]', tok, 600);                              // 홈 탭(카풀 화면 유지)
    await tap('[data-act="back"]', tok, 700);                                // 홈
    await tap('[data-act="push"][data-arg="connect"]', tok, 900);           // 유니커넥트
    await tap('[data-act="ucCat"][data-arg="3"]', tok, 900);                // 운동
    await tap('[data-act="ucCat"][data-arg="2"]', tok, 900);                // 구해요
    await tap('[data-act="back"]', tok, 700);
    await tap('[data-act="push"][data-arg="market"]', tok, 900);            // 중고 거래
    await tap('[data-act="mkCat"][data-arg="tutor"]', tok, 850);
    await tap('[data-act="mkCat"][data-arg="room"]', tok, 850);
    await tap('[data-act="back"]', tok, 700);
    await tap('[data-act="push"][data-arg="board"]', tok, 900);             // 대나무숲
    await tap('[data-act="boardDetail"][data-arg="b2"]', tok, 900);
    await tap('[data-act="bdLike"]', tok, 1100);                             // 좋아요
    await tap('[data-act="back"]', tok, 600);
    await tap('[data-act="back"]', tok, 1000);                               // 홈
    window.__uniwayTour = {loops: ((window.__uniwayTour || {}).loops || 0) + 1, ms: Math.round(performance.now() - t0)};
  }
}
function startAuto(){
  if (AUTO.on) return;
  AUTO.on = true; const tok = ++AUTO.tok;
  tour(tok).catch(err => { if (err !== STOP) console.warn(err); });
}
function stopAuto(){ if (!AUTO.on) return; AUTO.on = false; AUTO.tok++; $('#fx').innerHTML = ''; }
['pointerdown', 'wheel', 'keydown', 'touchstart'].forEach(t => app.addEventListener(t, e => { if (e.isTrusted && AUTO.on) stopAuto(); }, {capture: true, passive: true}));

/* =========================================================
   8. 호스트 연동 · 스케일 · 시작
   ========================================================= */
window.addEventListener('message', ev => {
  const d = ev.data; if (!d || typeof d !== 'object') return;
  if (d.type === 'demo:goto' && typeof d.screen === 'string'){ stopAuto(); goto(d.screen); }
  if (d.type === 'demo:autoplay'){ if (d.on) startAuto(); else stopAuto(); }
});
function fit(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / 390, vh / 844);
  app.style.transform = `translate(${(vw - 390 * s) / 2}px,${(vh - 844 * s) / 2}px) scale(${s})`;
}
window.addEventListener('resize', fit);
fit();
drawNav();
goto(QS.get('screen') || 'home');
if (QS.get('autoplay') === '1') startAuto();
window.UniwayDemo = {goto, startAuto, stopAuto, state: () => ({autoplay: AUTO.on, tab: cur, screen: top() && top().id})};
})();
</script>
